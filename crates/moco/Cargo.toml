[package]
name = "moco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
moco-core = { path = "../moco-core" }
serde_json = "1"
ratatui = { version = "0.25", default-features = false, features = ["crossterm"] } # held at 0.25 from the Rust 1.73 days (0.26+ needs 1.74); API gaps in tui/compat.rs
crossterm = "0.27"
unicode-width = "0.2"
ignore = ">=0.4.22, <=0.4.23" # 0.4.24+ is edition 2024
similar = "2"
