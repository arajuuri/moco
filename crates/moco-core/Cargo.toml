[package]
name = "moco-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
fastrand = "2"
rusqlite = { version = "*", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
ureq = "2"
sha2 = "0.10"
similar = "2"
base64 = "0.22"
