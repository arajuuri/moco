[package]
name = "moco-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# macos-10.7 branch: versions are held to what builds with Rust 1.78 and runs on macOS 10.7 (docs/14-macos-10.7.md).
# `rust-version` makes Cargo's resolver prefer compatible releases (`CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback`
# with a newer cargo), but several crates under-declare it, hence the explicit caps below.
[dependencies]
fastrand = "2"
getrandom = "0.2" # already in the tree through ring; 0.3 needs a newer Rust
rusqlite = { version = "~0.32.1", features = ["bundled"] } # 0.33+ uses #[expect] (Rust 1.81); 0.32.1 bundles SQLite 3.46.0 (archive#103)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
globset = ">=0.4.14, <=0.4.15" # 0.4.16+ is edition 2024
ignore = ">=0.4.22, <=0.4.23" # 0.4.24+ is edition 2024
libc = "0.2"
regex = "1"
ureq = "2"
sha2 = "0.10"
similar = "2"
base64 = "0.22"
