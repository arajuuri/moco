[package]
name = "moco-spike"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# Default: Mozilla roots bundled in the binary. `native-certs`: macOS system trust store.
native-certs = ["ureq/native-certs"]

[dependencies]
ureq = "2"
rusqlite = { version = "*", features = ["bundled"] }
