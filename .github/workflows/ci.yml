# `cargo fmt --check` is left out on purpose: the tree is not rustfmt formatted (~1900 diffs),
# so enabling it needs a one-off `cargo fmt` commit first.
name: ci

# No path filters: `main` requires the `linux` check, and a filtered-out run would leave it pending on docs-only PRs.
on:
  push:
    branches: [main]
  pull_request:
  # Run the macOS job for any branch: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# A new push to a PR cancels its running checks. Runs on `main` are never cancelled, so every merge gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes
      - uses: dtolnay/rust-toolchain@d2e383c7f7a2470b3f766fe5611d0bc4ffe2fd71 # 1.78.0 branch; keep in sync with rust-toolchain.toml
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace # python3 is preinstalled; the fake MCP/LLM servers need it

  # Tests on macOS: symlinks under /var -> /private/var, case-insensitive file systems, process groups and
  # sandbox-exec behave differently from Linux. This runner is newer than Mojave, so the Mojave machine run stays a
  # manual check.
  #
  # macOS minutes cost far more than Linux ones, so this is one job that compiles once: the tests are built with the
  # Lion deployment target, and the deployment-target and link checks (docs/14-macos-10.7.md) run on the `moco`
  # binary that `cargo test` builds for the integration tests. Those properties come from the target, the linker
  # and the dependencies, not the profile, so the release build (`scripts/install.sh`) is not compiled here.
  # It runs on pushes to `main` and on manual dispatch, not on every PR push.
  #
  # The classic linker (`-ld_classic`) is needed for an LC_UNIXTHREAD entry point, as in release.yml (archive#113), and
  # std is rebuilt for a Core 2 CPU without SSE4.1, also as in release.yml, so the SSE4 check passes.
  #
  # Disabled to avoid macOS runner costs: remove `false &&` to turn it on.
  macos:
    if: false && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.7"
      RUSTFLAGS: "-C link-arg=-ld_classic -C target-cpu=core2" # LC_UNIXTHREAD (archive#113); no SSE4.1 (release.yml)
      RUSTC_BOOTSTRAP: "1" # for -Zbuild-std only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes
      - uses: dtolnay/rust-toolchain@d2e383c7f7a2470b3f766fe5611d0bc4ffe2fd71 # 1.78.0 branch; keep in sync with rust-toolchain.toml
        with:
          components: rust-src # -Zbuild-std compiles std from it
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # PR runs reuse main's cache instead of storing their own
      - run: cargo test --locked --workspace -Zbuild-std --target x86_64-apple-darwin # python3 is preinstalled; the fake MCP/LLM servers need it
      - name: Check minos <= 10.7, an LC_UNIXTHREAD entry point, nothing newer than Lion linked and no SSE4 code
        run: scripts/check-macos-binary.sh target/x86_64-apple-darwin/debug/moco
