# Release: tag `main`, build the macOS binary at that tag, and publish it as a GitHub release.
#
#   gh workflow run release.yml --ref main
#
# The version is `version` in `[workspace.package]` (root `Cargo.toml`); bump it in a PR first ("Versions and
# releases" in CONTRIBUTING.md). The job tags the commit `vX.Y.Z` *before* building, so `git describe` makes the
# binary report exactly `X.Y.Z`, and pushes the tag only after the build and the 10.7 checks pass: a failed run leaves
# no tag behind. Running it again for a commit that already has its tag rebuilds and replaces the release files; a
# tag that exists on another commit stops the run (bump the version instead).
#
# The runner's default linker (Xcode 15+) always writes an LC_MAIN entry point, which Lion cannot start (#113), so the
# build uses the classic linker (`-ld_classic`), which writes LC_UNIXTHREAD for a 10.7 target. Apple has deprecated
# it; if a runner image drops it, the build or the entry-point check fails and nothing is published.
#
# rustc's x86_64-apple-darwin target assumes a Penryn CPU (SSE4.1), and so does the std that rustup ships. The first
# Core 2 Duo Macs (Merom, 2006-2007) run Lion but have no SSE4.1, and such a binary dies there with "Illegal
# instruction: 4". The build therefore uses `-C target-cpu=core2` and rebuilds std with it
# (`-Zbuild-std`, which on a stable compiler needs RUSTC_BOOTSTRAP=1 and the rust-src component); the binary lands in
# target/x86_64-apple-darwin/release. scripts/check-macos-binary.sh fails if SSE4 code shows up again.
#
# Supply chain (#126): the `macos` job compiles every dependency's build scripts and proc macros, so it gets a
# read-only token and keeps no git credentials. Only the `publish` job, which runs no third-party Rust code, can
# write: it re-creates the same tag, pushes it and uploads the files `macos` built. Third-party actions are pinned
# to commit SHAs (Dependabot, `.github/dependabot.yml`, proposes updates).
name: release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {} # each job asks for what it needs

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "10.7"
  # -ld_classic: LC_UNIXTHREAD, not LC_MAIN, so Lion can start the binary (#113). core2: no SSE4.1 (see above).
  RUSTFLAGS: "-C link-arg=-ld_classic -C target-cpu=core2"
  RUSTC_BOOTSTRAP: "1" # for -Zbuild-std only

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      new: ${{ steps.tag.outputs.new }}
      name: ${{ steps.pkg.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the history and the tags
          persist-credentials: false # nothing in this job pushes; build scripts must not find a token in .git/config
      - uses: dtolnay/rust-toolchain@d2e383c7f7a2470b3f766fe5611d0bc4ffe2fd71 # 1.78.0 branch; keep in sync with rust-toolchain.toml
        with:
          components: rust-src # -Zbuild-std compiles std from it

      - name: Tag the commit (locally)
        id: tag
        run: |
          version=$(awk '/^\[workspace.package\]/{f=1; next} /^\[/{f=0} f && /^version *=/{gsub(/.*= *"|".*/, ""); print; exit}' Cargo.toml)
          echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad [workspace.package] version '$version'"; exit 1; }
          tag="v$version"
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            [ "$existing" = "$GITHUB_SHA" ] || { echo "::error::$tag already tags $existing, not $GITHUB_SHA: bump [workspace.package] version first"; exit 1; }
            echo "$tag already tags this commit; rebuilding its release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$tag" -m "moco $version" "$GITHUB_SHA"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # std's own dependencies come from the rust-src lockfile, so --locked holds for them too.
      - run: cargo build --release --locked -p moco -Zbuild-std=std,panic_abort --target x86_64-apple-darwin

      - name: Check the binary
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          scripts/check-macos-binary.sh target/x86_64-apple-darwin/release/moco
          target/x86_64-apple-darwin/release/moco --version
          first=$(target/x86_64-apple-darwin/release/moco --version | head -1)
          [ "$first" = "moco $VERSION" ] || { echo "::error::binary reports '$first', expected 'moco $VERSION'"; exit 1; }

      - name: Package
        id: pkg
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          name="moco-$VERSION-macos-x86_64"
          mkdir -p "dist/$name"
          cp target/x86_64-apple-darwin/release/moco README.md LICENSE-opencode NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/${{ steps.pkg.outputs.name }}.tar.gz
            dist/${{ steps.pkg.outputs.name }}.tar.gz.sha256

  # Pushes the tag and publishes what `macos` built and checked. It runs only if `macos` succeeded, so a failed build
  # still leaves no tag. The tag is re-created here on the same commit with the same name and message; `git describe`
  # in the build saw an identical one.
  publish:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the push below passes the token explicitly, for that one command
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.macos.outputs.name }}
          path: dist

      - name: Push the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.macos.outputs.tag }}
          VERSION: ${{ needs.macos.outputs.version }}
          NAME: ${{ needs.macos.outputs.name }}
          NEW: ${{ needs.macos.outputs.new }}
        run: |
          if [ "$NEW" != false ]; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "moco $VERSION" "$GITHUB_SHA"
            # The token reaches git through a one-off credential helper that reads it from the environment: it is
            # not written to .git/config and not on the command line.
            git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
              push origin "refs/tags/$TAG"
          fi
          files=("dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "moco $VERSION" \
              --notes "moco $VERSION for macOS 10.7 (Lion) through 10.14 (Mojave), Intel x86_64. Unpack and put \`moco\` on your PATH, or build from source with \`scripts/install.sh\`."
          fi
