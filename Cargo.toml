[workspace]
members = ["crates/*"]
exclude = ["spike"]
resolver = "2"

[workspace.package]
# The release number: bump it only for a release, then tag that commit `vX.Y.Z` ("Versions and releases" in
# CONTRIBUTING.md). Every build shows `git describe` on top of it (crates/moco-core/build.rs).
version = "0.2.2"
edition = "2021"
rust-version = "1.78"
publish = false
license = "MIT"
